name: CI/CD & MLOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=xml:coverage.xml

      - name: Ingestion Benchmark Verification
        run: |
          python -m src.benchmark --samples 1000 --runs 1

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: code-coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Validate Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: applied-ds-ml-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
