[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ds-ml-curriculum"
version = "2.0.0"
description = "Production-grade modular curriculum template for Applied Data Science & Machine Learning"
readme = "README.md"
authors = [{ name = "Applied ML Curriculum Team", email = "curriculum@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["machine-learning", "mlops", "churn-prediction", "lifetime-value", "fastapi", "duckdb", "xai", "shap"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers -v"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
