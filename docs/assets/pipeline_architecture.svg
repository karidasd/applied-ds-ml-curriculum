<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">End-to-End Production Machine Learning Architecture</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">From Raw Subscription Telemetry to Calibrated Modeling, Business Value Optimization &amp; FastAPI Deployment</text>

  <!-- CONNECTOR LINES -->
  <path d="M 285 240 L 335 240" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="335,235 345,240 335,245" fill="#38bdf8" />

  <path d="M 575 240 L 625 240" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="625,235 635,240 625,245" fill="#a855f7" />

  <path d="M 865 240 L 915 240" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="915,235 925,240 915,245" fill="#10b981" />

  <!-- STAGE 1: INGESTION & DUCKDB -->
  <g transform="translate(50, 110)" filter="url(#glow)">
    <rect width="235" height="290" rx="16" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="8" rx="4" fill="url(#accent1)" />
    <circle cx="35" cy="38" r="16" fill="#0284c7" fill-opacity="0.2"/>
    <text x="35" y="44" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">1</text>
    <text x="62" y="42" fill="#f8fafc" font-size="16" font-weight="600">Data &amp; Analytics</text>
    
    <rect x="18" y="70" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="96" fill="#e2e8f0" font-size="13" font-weight="500">DuckDB SQL Engine</text>
    
    <rect x="18" y="122" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="148" fill="#e2e8f0" font-size="13" font-weight="500">Cohort Churn Tracking</text>

    <rect x="18" y="174" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#e2e8f0" font-size="13" font-weight="500">30-Day Usage Velocity</text>

    <rect x="18" y="226" width="199" height="42" rx="8" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="30" y="252" fill="#7dd3fc" font-size="12" font-weight="600">Sub-Second Execution</text>
  </g>

  <!-- STAGE 2: FEATURE ENGINEERING & ANTI-LEAKAGE -->
  <g transform="translate(340, 110)" filter="url(#glow)">
    <rect width="235" height="290" rx="16" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="8" rx="4" fill="url(#accent2)" />
    <circle cx="35" cy="38" r="16" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="35" y="44" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="bold">2</text>
    <text x="62" y="42" fill="#f8fafc" font-size="16" font-weight="600">Anti-Leakage Pipeline</text>

    <rect x="18" y="70" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="96" fill="#e2e8f0" font-size="13" font-weight="500">Temporal Train/Test Split</text>
    
    <rect x="18" y="122" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="148" fill="#e2e8f0" font-size="13" font-weight="500">Custom Domain Ratios</text>

    <rect x="18" y="174" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#e2e8f0" font-size="13" font-weight="500">ColumnTransformer</text>

    <rect x="18" y="226" width="199" height="42" rx="8" fill="#581c87" fill-opacity="0.3" stroke="#c084fc" stroke-width="1"/>
    <text x="30" y="252" fill="#e9d5ff" font-size="12" font-weight="600">Zero Lookahead Bias</text>
  </g>

  <!-- STAGE 3: MODELING & PROFIT OPTIMIZATION -->
  <g transform="translate(630, 110)" filter="url(#glow)">
    <rect width="235" height="290" rx="16" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="8" rx="4" fill="url(#accent3)" />
    <circle cx="35" cy="38" r="16" fill="#059669" fill-opacity="0.2"/>
    <text x="35" y="44" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">3</text>
    <text x="62" y="42" fill="#f8fafc" font-size="16" font-weight="600">Calibrated ML &amp; LTV</text>

    <rect x="18" y="70" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="96" fill="#e2e8f0" font-size="13" font-weight="500">GradientBoostingClassifier</text>
    
    <rect x="18" y="122" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="148" fill="#e2e8f0" font-size="13" font-weight="500">Isotonic Calibration</text>

    <rect x="18" y="174" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#e2e8f0" font-size="13" font-weight="500">Continuous LTV Regressor</text>

    <rect x="18" y="226" width="199" height="42" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-width="1"/>
    <text x="30" y="252" fill="#a7f3d0" font-size="12" font-weight="600">Expected Profit Curve (t*)</text>
  </g>

  <!-- STAGE 4: PRODUCTION API & CI/CD -->
  <g transform="translate(920, 110)" filter="url(#glow)">
    <rect width="235" height="290" rx="16" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="8" rx="4" fill="url(#accent4)" />
    <circle cx="35" cy="38" r="16" fill="#d97706" fill-opacity="0.2"/>
    <text x="35" y="44" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">4</text>
    <text x="62" y="42" fill="#f8fafc" font-size="16" font-weight="600">Serving &amp; Governance</text>

    <rect x="18" y="70" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="96" fill="#e2e8f0" font-size="13" font-weight="500">FastAPI REST Microservice</text>
    
    <rect x="18" y="122" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="148" fill="#e2e8f0" font-size="13" font-weight="500">Pydantic v2 Contracts</text>

    <rect x="18" y="174" width="199" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#e2e8f0" font-size="13" font-weight="500">Pytest Integration Suite</text>

    <rect x="18" y="226" width="199" height="42" rx="8" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1"/>
    <text x="30" y="252" fill="#fde68a" font-size="12" font-weight="600">GitHub Actions CI Matrix</text>
  </g>

  <!-- Footer note -->
  <text x="600" y="445" text-anchor="middle" fill="#64748b" font-size="12">Applied DS &amp; ML Production Template • Enterprise Curriculum Standard</text>
</svg>
