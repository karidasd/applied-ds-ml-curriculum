<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Title -->
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Production Inference API: FastAPI &amp; Swagger UI Preview</text>
  <text x="475" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">High-throughput real-time customer scoring with Pydantic v2 schema contracts</text>

  <!-- WINDOW CONTAINER -->
  <rect x="75" y="95" width="800" height="350" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header Bar -->
  <rect x="75" y="95" width="800" height="36" rx="12" fill="#0f172a"/>
  <circle cx="100" cy="113" r="5" fill="#ef4444"/>
  <circle cx="116" cy="113" r="5" fill="#f59e0b"/>
  <circle cx="132" cy="113" r="5" fill="#10b981"/>
  <text x="475" y="118" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">FastAPI Swagger UI — http://localhost:8000/docs</text>

  <!-- Endpoint Banner -->
  <rect x="100" y="145" width="750" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <rect x="110" y="152" width="60" height="28" rx="5" fill="#10b981"/>
  <text x="140" y="171" text-anchor="middle" fill="#064e3b" font-size="12" font-weight="bold">POST</text>
  <text x="185" y="171" fill="#ecfdf5" font-size="14" font-weight="600">/predict</text>
  <text x="750" y="171" text-anchor="end" fill="#a7f3d0" font-size="12">Score Single Customer Churn &amp; LTV</text>

  <!-- Left Column: JSON Request Payload -->
  <g transform="translate(100, 205)">
    <rect width="360" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">REQUEST PAYLOAD (CustomerProfile)</text>
    
    <text x="15" y="50" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">{</text>
    <text x="25" y="68" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "contract_type": <tspan fill="#38bdf8">"Month-to-month"</tspan>,</text>
    <text x="25" y="86" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "tenure_months": <tspan fill="#f59e0b">6</tspan>,</text>
    <text x="25" y="104" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "monthly_charges": <tspan fill="#f59e0b">89.50</tspan>,</text>
    <text x="25" y="122" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "num_support_tickets": <tspan fill="#f59e0b">4</tspan>,</text>
    <text x="25" y="140" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "avg_weekly_logins": <tspan fill="#f59e0b">4.2</tspan>,</text>
    <text x="25" y="158" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "usage_drop_pct_last_30d": <tspan fill="#ef4444">0.45</tspan>,</text>
    <text x="25" y="176" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "has_premium_support": <tspan fill="#f59e0b">0</tspan></text>
    <text x="15" y="196" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">}</text>
  </g>

  <!-- Right Column: JSON Response Payload -->
  <g transform="translate(490, 205)">
    <rect width="360" height="220" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="25" fill="#34d399" font-size="12" font-weight="bold">RESPONSE (200 OK — 12ms latency)</text>
    
    <text x="15" y="50" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">{</text>
    <text x="25" y="68" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "churn_probability": <tspan fill="#ef4444">0.7421</tspan>,</text>
    <text x="25" y="86" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "churn_prediction": <tspan fill="#ef4444">1</tspan>,</text>
    <text x="25" y="104" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "risk_tier": <tspan fill="#ef4444">"Critical"</tspan>,</text>
    <text x="25" y="122" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "retention_action_recommended": <tspan fill="#34d399">true</tspan>,</text>
    <text x="25" y="140" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "decision_threshold_applied": <tspan fill="#38bdf8">0.35</tspan>,</text>
    <text x="25" y="158" fill="#e2e8f0" font-size="11" font-family="Consolas, monospace">  "estimated_lifetime_value": <tspan fill="#f59e0b">724.80</tspan></text>
    <text x="15" y="180" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">}</text>
  </g>
</svg>
