<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <!-- Title -->
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">MLOps Telemetry Monitoring: Data Drift &amp; Covariate Shift</text>
  <text x="475" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Detecting statistical distribution divergence before model degradation causes business loss</text>

  <!-- Left: Distribution Shift Chart -->
  <g transform="translate(60, 95)">
    <rect width="450" height="370" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="600">Covariate Shift: Empirical Density (KDE)</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Feature: 30-day Usage Drop Telemetry</text>

    <!-- Chart Grid -->
    <rect x="25" y="80" width="400" height="230" fill="#0f172a" rx="8" stroke="#334155"/>
    <line x1="25" y1="270" x2="425" y2="270" stroke="#475569"/>

    <!-- Baseline Curve (Blue) -->
    <path d="M 40 270 Q 140 110 210 270" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 40 270 Q 140 110 210 270 Z" fill="#38bdf8" fill-opacity="0.15"/>

    <!-- Drifted Curve (Red, shifted right) -->
    <path d="M 170 270 Q 280 120 390 270" fill="none" stroke="#f87171" stroke-width="3"/>
    <path d="M 170 270 Q 280 120 390 270 Z" fill="#f87171" fill-opacity="0.15"/>

    <!-- KS Distance arrow -->
    <line x1="200" y1="170" x2="250" y2="170" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="225" y="155" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">KS Distance (D)</text>

    <!-- Legend -->
    <circle cx="50" cy="295" r="5" fill="#38bdf8"/>
    <text x="65" y="299" fill="#cbd5e1" font-size="11">Baseline (Training Set)</text>

    <circle cx="230" cy="295" r="5" fill="#f87171"/>
    <text x="245" y="299" fill="#cbd5e1" font-size="11">Production Telemetry Window</text>

    <!-- Statistical Result -->
    <rect x="25" y="322" width="400" height="35" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="344" fill="#38bdf8" font-size="12" font-weight="bold">KS Test:</text>
    <text x="100" y="344" fill="#e2e8f0" font-size="12">Stat = 0.342 | p-value = 1.2e-6  ⟶ </text>
    <text x="320" y="344" fill="#f87171" font-size="12" font-weight="bold">REJECT H₀ (DRIFT)</text>
  </g>

  <!-- Right: PSI Metric & Alert Thresholds -->
  <g transform="translate(540, 95)">
    <rect width="350" height="370" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-size="15" font-weight="600">Population Stability Index (PSI)</text>
    <text x="25" y="55" fill="#94a3b8" font-size="12">Quantifying distribution divergence</text>

    <!-- PSI Formula Card -->
    <rect x="20" y="80" width="310" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="175" y="108" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">PSI = ∑ (Actual - Expected) · ln(A / E)</text>

    <!-- PSI Bands -->
    <g transform="translate(20, 145)">
      <!-- Band 1: Green -->
      <rect width="310" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="26" fill="#34d399" font-size="12" font-weight="bold">PSI &lt; 0.10: Stable</text>
      <text x="290" y="26" text-anchor="end" fill="#a7f3d0" font-size="11">No action required</text>

      <!-- Band 2: Yellow -->
      <rect y="55" width="310" height="42" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="81" fill="#fbbf24" font-size="12" font-weight="bold">0.10 ≤ PSI &lt; 0.25: Warning</text>
      <text x="290" y="81" text-anchor="end" fill="#fde68a" font-size="11">Investigate features</text>

      <!-- Band 3: Red -->
      <rect y="110" width="310" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="136" fill="#f87171" font-size="12" font-weight="bold">PSI ≥ 0.25: Critical Drift</text>
      <text x="290" y="136" text-anchor="end" fill="#fca5a5" font-size="11">Trigger retraining</text>
    </g>

    <!-- Automated Trigger Card -->
    <rect x="20" y="315" width="310" height="42" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8"/>
    <text x="175" y="341" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">⚡ Automated Webhook: POST /telemetry/drift</text>
  </g>
</svg>
