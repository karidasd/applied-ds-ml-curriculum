<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Financial Expected Value: Net Profit vs Decision Threshold</text>
  <text x="475" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">Maximizing commercial retention ROI instead of arbitrarily defaulting to t = 0.50</text>

  <!-- Formula Card -->
  <rect x="180" y="90" width="590" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="475" y="115" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">Net Profit(t) = TP(t) · [P(save) · Value - Cost] - FP(t) · Cost</text>

  <!-- Chart Area -->
  <!-- Axes: X: 120 to 860 (width 740), Y: 430 to 170 (height 260) -->
  <rect x="120" y="150" width="750" height="290" fill="#1e293b" fill-opacity="0.6" rx="12" stroke="#334155" stroke-width="1"/>

  <!-- Horizontal Gridlines -->
  <line x1="120" y1="400" x2="870" y2="400" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="105" y="405" text-anchor="end" fill="#64748b" font-size="12">$0</text>

  <line x1="120" y1="340" x2="870" y2="340" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="105" y="345" text-anchor="end" fill="#64748b" font-size="12">$5,000</text>

  <line x1="120" y1="280" x2="870" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="105" y="285" text-anchor="end" fill="#64748b" font-size="12">$10,000</text>

  <line x1="120" y1="220" x2="870" y2="220" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="105" y="225" text-anchor="end" fill="#64748b" font-size="12">$15,000</text>

  <line x1="120" y1="175" x2="870" y2="175" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="105" y="180" text-anchor="end" fill="#64748b" font-size="12">$18,500</text>

  <!-- X-Axis Labels -->
  <text x="150" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.05</text>
  <text x="230" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.15</text>
  <text x="310" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.25</text>
  <text x="390" y="465" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">0.35 (t*)</text>
  <text x="470" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.45</text>
  <text x="510" y="465" text-anchor="middle" fill="#f87171" font-size="12">0.50 (Default)</text>
  <text x="590" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.60</text>
  <text x="670" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.70</text>
  <text x="750" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.80</text>
  <text x="830" y="465" text-anchor="middle" fill="#94a3b8" font-size="12">0.90</text>
  <text x="495" y="495" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">Classification Probability Threshold (t)</text>

  <!-- Curve Path & Shading -->
  <!-- Start (150, 360), peak at (390, 180), drops to (830, 395) -->
  <path d="M 150 360 C 230 260, 310 185, 390 178 C 450 185, 510 245, 590 310 C 680 370, 760 395, 830 400 L 830 400 L 150 400 Z" fill="url(#curveFill)"/>
  <path d="M 150 360 C 230 260, 310 185, 390 178 C 450 185, 510 245, 590 310 C 680 370, 760 395, 830 400" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glowGreen)"/>

  <!-- Optimal Threshold Indicator (t* = 0.35) -->
  <line x1="390" y1="178" x2="390" y2="440" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="390" cy="178" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  
  <rect x="260" y="195" width="220" height="52" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="370" y="217" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">★ Optimal Threshold: t* = 0.35</text>
  <text x="370" y="235" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Max Net Profit: $18,480</text>

  <!-- Naive 0.50 Threshold Indicator -->
  <line x1="510" y1="245" x2="510" y2="440" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="510" cy="245" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  
  <rect x="525" y="235" width="180" height="46" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="615" y="255" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">Default Threshold (0.50)</text>
  <text x="615" y="271" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Net Profit: $11,230</text>

  <!-- Uplift Badge -->
  <rect x="420" y="142" width="150" height="28" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="161" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">+ $7,250 Profit Uplift</text>
</svg>
